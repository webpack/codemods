version: 2
updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 3
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    cooldown:
      default-days: 3
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
